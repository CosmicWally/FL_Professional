---
layout: default
title: Contact | Dr. Felicity Leonard DVM
permalink: /contact/
---
<main class="contact-page">
  <section class="contact-layout" aria-labelledby="contact-title">
    <div class="contact-copy">
      <h1 id="contact-title">contact information</h1>
      <ul class="contact-details">
        <li>
          <strong>Email:</strong>
          {% if site.data.site.email_link.size > 0 %}
            <a href="mailto:{{ site.data.site.email_link }}">{{ site.data.site.email }}</a>
          {% else %}
            <span>{{ site.data.site.email }}</span>
          {% endif %}
        </li>
        <li><strong>Address:</strong> <span>{{ site.data.site.address }}</span></li>
      </ul>
    </div>
    <div class="contact-image-wrap">
      <img src="{{ site.data.site.contact_image }}" alt="{{ site.data.site.contact_image_alt | escape }}">
    </div>
  </section>
</main>
