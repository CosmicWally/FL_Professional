<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="theme-color" content="#f6f7f2">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Home - {{ site.data.site.veterinarian }}">
          <span class="mark" aria-hidden="true">FL</span>
          <span class="brand-copy"><strong>{{ site.data.site.veterinarian }}</strong><small>Veterinary care · Colorado</small></span>
        </a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
          <a href="{{ '/handouts/' | relative_url }}"{% if page.url == '/handouts/' %} aria-current="page"{% endif %}>Handouts</a>
        </nav>
      </div>
    </header>
    {{ content }}
  </body>
</html>
